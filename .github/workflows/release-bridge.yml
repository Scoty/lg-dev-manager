name: Publish bridge to npm

# Pushing a tag bridge-vX.Y.Z publishes apps/bridge as lg-dev-manager-bridge@X.Y.Z with npm trusted publishing:
# GitHub proves to npm that this workflow, in this repository, is publishing — no npm token is stored anywhere, and
# the package page links back to the run (provenance).
#
# One-time setup (see PLAN.md §11): on npmjs.com → lg-dev-manager-bridge → Settings → Trusted publisher → GitHub
# Actions: user "Scoty", repository "lg-dev-manager", workflow "release-bridge.yml". npm drops a trusted publisher that
# hasn't published within 48 hours of being added, so add it right before pushing the next bridge tag.
on:
  push:
    tags: ['bridge-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/bridge/package.json').version")
          test "$TAG" = "bridge-v$version" || { echo "Tag $TAG doesn't match apps/bridge/package.json version $version"; exit 1; }
      - run: pnpm build
      - run: pnpm test
      # pnpm pack runs prepack (bundles the web app, LICENSE, NOTICE) and resolves workspace: versions;
      # npm publish then authenticates with the workflow's OIDC identity.
      - name: Publish
        working-directory: apps/bridge
        run: |
          pnpm pack
          npm publish ./lg-dev-manager-bridge-*.tgz --access public --provenance
