name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version (engines: >=22.12) and the active LTS the project is developed on (.nvmrc).
        node: ['22.12', '24']
    name: build (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The standalone app, built and tested on every OS and CPU it is released for (release-app.yml uses the same
  # runners), so a change that breaks it shows up before a release.
  app:
    name: app (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-2025 }
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node apps/bridge/scripts/build-app.mjs
      - name: Test the app
        shell: bash
        run: |
          app="$PWD/apps/bridge/release/bin/lg-dev-manager-bridge"
          [ "$RUNNER_OS" = Windows ] && app="$app.exe"
          LGDM_APP="$app" pnpm --filter lg-dev-manager-bridge exec vitest run src/app.smoke.test.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Active LTS, pinned in .nvmrc (Node 22.12+ is supported too; the build job checks both).
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lgdm/web exec playwright install --with-deps chromium
      # The rig's fake TV is 127.0.0.1; the runner's own SSH server on port 22 would make it look like a rooted TV
      # with SSH on (the wizard test needs that port closed).
      - name: Stop the runner's SSH server
        run: sudo systemctl stop ssh.socket ssh.service 2>/dev/null || sudo systemctl stop ssh 2>/dev/null || true
      # Built UI served by a real bridge, talking to mock TVs (apps/web/e2e/server.ts).
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
